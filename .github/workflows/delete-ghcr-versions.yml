name: Delete GHCR versions

on:
  workflow_dispatch:
    inputs:
      version_ids:
        description: "Comma-separated numeric GHCR version IDs"
        required: true
        type: string

permissions:
  packages: write

jobs:
  delete:
    name: "Delete versions"
    runs-on: ubuntu-latest
    steps:
      - name: Delete listed package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_IDS: ${{ inputs.version_ids }}
        run: |
          set -euo pipefail
          echo "$VERSION_IDS" | tr ',' '\n' | while read -r id; do
            id="${id//[[:space:]]/}"
            [ -n "$id" ] || continue
            if ! printf '%s' "$id" | grep -Eq '^[0-9]+$'; then
              echo "::error::Refusing non-numeric version id: $id"
              exit 1
            fi
            echo "Deleting version $id"
            gh api --method DELETE "/users/underw8/packages/container/myspeed/versions/$id"
          done
